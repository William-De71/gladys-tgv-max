<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the TGV MAX integration for Gladys Assistant (illustration,
       not a logo of SNCF). A high-speed train crossing the countryside at
       dawn, and a departure board announcing the trains with MAX seats.
       Built into cover.jpg by scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4f86"/>
      <stop offset="0.55" stop-color="#e59a74"/>
      <stop offset="1" stop-color="#f6d6a8"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8f5a"/>
      <stop offset="1" stop-color="#4c6b40"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8cdd6"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>
  <circle cx="610" cy="250" r="46" fill="#ffe2a6" opacity="0.9"/>

  <!-- far hills, near hills -->
  <path d="M0 300 C120 250 220 280 320 262 C430 242 520 286 640 258 C700 245 760 256 800 264 L800 534 L0 534 Z" fill="#8aa06f"/>
  <path d="M0 340 C140 300 260 330 400 312 C540 296 660 330 800 312 L800 534 L0 534 Z" fill="url(#hills)"/>

  <!-- the line: ballast and rails -->
  <path d="M0 372 L800 352 L800 376 L0 398 Z" fill="#a39b8c"/>
  <path d="M0 378 L800 358" stroke="#5d5a55" stroke-width="3"/>
  <path d="M0 390 L800 369" stroke="#5d5a55" stroke-width="3"/>

  <!-- the train: a power car with its nose, then two coaches -->
  <g>
    <path d="M60 370 L60 318 C60 312 64 308 70 308 L420 300 C470 299 520 312 560 334 C578 344 586 354 586 362 L586 362 L60 372 Z" fill="url(#body)" stroke="#8a919c" stroke-width="2"/>
    <path d="M62 346 L584 336 L586 350 L62 360 Z" fill="#3d6fb6"/>
    <path d="M62 352 L585 342" stroke="#e0b14a" stroke-width="3"/>
    <path d="M452 306 C486 308 520 318 546 332 L500 334 C486 322 470 312 452 310 Z" fill="#253246"/>
    <g fill="#33445c">
      <rect x="90" y="318" width="34" height="16" rx="3"/>
      <rect x="134" y="317" width="34" height="16" rx="3"/>
      <rect x="178" y="316" width="34" height="16" rx="3"/>
      <rect x="222" y="315" width="34" height="16" rx="3"/>
      <rect x="276" y="314" width="34" height="16" rx="3"/>
      <rect x="320" y="313" width="34" height="16" rx="3"/>
      <rect x="364" y="312" width="34" height="16" rx="3"/>
    </g>
    <path d="M262 312 L264 368" stroke="#8a919c" stroke-width="2"/>
    <path d="M408 309 L410 365" stroke="#8a919c" stroke-width="2"/>
    <g fill="#2b2f36">
      <circle cx="100" cy="372" r="7"/><circle cx="124" cy="372" r="7"/>
      <circle cx="300" cy="368" r="7"/><circle cx="324" cy="368" r="7"/>
      <circle cx="500" cy="364" r="7"/><circle cx="524" cy="364" r="7"/>
    </g>
  </g>
  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M10 322 L48 321"/><path d="M0 338 L42 337"/><path d="M18 354 L50 353"/>
  </g>

  <!-- the departure board -->
  <g transform="translate(470 40)">
    <rect width="300" height="196" rx="14" fill="url(#board)" stroke="#2d3746" stroke-width="3"/>
    <text x="20" y="34" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#f0c35a">Places MAX</text>
    <text x="280" y="34" text-anchor="end" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#9aa6b6">06:23</text>
    <path d="M20 46 H280" stroke="#2d3746" stroke-width="2"/>
    <g font-family="DejaVu Sans Mono, monospace" font-size="16">
      <text x="20" y="76" fill="#ffffff">06:20</text>
      <text x="82" y="76" fill="#dfe6ef">Paris → Lyon</text>
      <circle cx="270" cy="71" r="7" fill="#3fbf6f"/>
      <text x="20" y="110" fill="#ffffff">17:00</text>
      <text x="82" y="110" fill="#dfe6ef">Lyon → Paris</text>
      <circle cx="270" cy="105" r="7" fill="#3fbf6f"/>
      <text x="20" y="144" fill="#ffffff">18:04</text>
      <text x="82" y="144" fill="#dfe6ef">Lille → Nice</text>
      <circle cx="270" cy="139" r="7" fill="#6b7686"/>
    </g>
    <text x="20" y="178" font-family="DejaVu Sans, Arial, sans-serif" font-size="13" fill="#9aa6b6">MAX JEUNE · MAX SENIOR</text>
  </g>

  <!-- title -->
  <rect x="0" y="434" width="800" height="100" fill="#0f1724" opacity="0.82"/>
  <text x="40" y="478" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff">TGV MAX</text>
  <text x="40" y="510" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" fill="#dfe6ef">Places MAX JEUNE et MAX SENIOR · pour Gladys Assistant</text>
</svg>
